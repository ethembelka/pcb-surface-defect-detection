# Internal split of the official DsPCBSD+ train set (docs/EVALUATION_PROTOCOL.md).
#
# Why: the dataset has no test set, so the official val split is kept for final reporting only.
# To choose the best checkpoint during training we hold out 10 % of the official train images
# (val_internal); the remaining 90 % (train_fit) is what the model learns from.
# Official val is never referenced here; it is used only through configs/dspcbsd_test.yaml.
#
# Produced by: python scripts/make_splits.py --config configs/splits.yaml
yolo_root: data/DsPCBSD/DsPCBSD+/Data_YOLO   # contains images/{train,val}, labels/{train,val}; relative to repo root
source_split: train                          # the official split that is divided
val_ratio: 0.10                              # share held out as val_internal (stratified by each image's rarest class)
seed: 0                                      # fixed -> the same lists on every machine
out_dir: data/splits                         # git-tracked lists + split_stats.json (copies are also put in yolo_root)
train_list: train_fit.txt
val_list: val_internal.txt
stats_file: split_stats.json
