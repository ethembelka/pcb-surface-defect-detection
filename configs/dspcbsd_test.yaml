# DsPCBSD+ dataset config — FINAL REPORTING ONLY.
#
# "Test" = the official val split (2 051 images). The dataset has no separate test set, so this
# split plays that role: it is never used for training, early stopping or any setting choice
# (docs/EVALUATION_PROTOCOL.md). Each trained model is evaluated on it exactly once.
#
# `train` is required by the Ultralytics yaml format but is never read during evaluation;
# it points to train_fit for completeness. `path` is relative to the repo root and is made
# absolute by pcbdet.config.DatasetConfig before Ultralytics sees it.
path: data/DsPCBSD/DsPCBSD+/Data_YOLO
train: train_fit.txt
val: images/val
names:
  0: SH
  1: SP
  2: SC
  3: OP
  4: MB
  5: HB
  6: CS
  7: CFO
  8: BMFO
