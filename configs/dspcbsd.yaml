# DsPCBSD+ dataset config for Ultralytics YOLO.
# Sınıf sırası doğrulandı (15.10.2026): YOLO id = COCO category_id - 1; COCO: 1 SH ... 9 BMFO.
# Komutlar depo kökünden çalıştırılır; yol depo köküne göredir.
path: data/DsPCBSD/DsPCBSD+/Data_YOLO   # Colab'da defter bu yolu kendisi değiştirir
train: images/train
val: images/val
names:
  0: SH
  1: SP
  2: SC
  3: OP
  4: MB
  5: HB
  6: CS
  7: CFO
  8: BMFO
